name: DDEV add-on tests
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '25 8 * * *'
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: Enable remote debugging session
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        # The CLI supports stable versions >= 1.25.4; HEAD is intentionally
        # outside that contract. Check the minimum and latest stable instead.
        ddev_version: ['tag:v1.25.4', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: ddev/github-action-add-on-test@d614651ba8fffdb956ab7864f191c32353330d68 # ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ github.repository }}
          addon_ref: ${{ github.ref }}
